[project]
name = "typediff"
version = "0.1.0"
description = "Differential testing of Python type checkers (mypy, ty, pyright): separates real type-checker bugs from design divergences"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anay Gupta" }, { name = "Aarsh Verma" }, { name = "Ajay Meena" }]
requires-python = ">=3.10"
dependencies = []  # stdlib only; the checkers are invoked as subprocesses

[project.optional-dependencies]
# Versions used for all results in results/. See constraints.txt and docs/reproducibility.md.
tools = ["mypy==2.4.0", "ty==0.0.97", "pyright==1.1.414", "typing_extensions"]
test = ["pytest==8.3.5"]

[project.scripts]
typediff = "typediff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["typediff*"]

[tool.setuptools.package-data]
typediff = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
